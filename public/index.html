<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>জমির ফাইল — দলিল ও জমির রেকর্ড</title>
  <meta name="theme-color" content="#1f4d3a" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231f4d3a'/><path d='M14 44 L32 18 L50 44 Z' fill='%23e9c46a'/><rect x='14' y='44' width='36' height='5' rx='2' fill='%23f4efe4'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Tiro+Bangla&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="busy-bar" id="busyBar" hidden></div>
  <header class="topbar" id="topbar" hidden>
    <a href="#/" class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64"><path d="M10 46 L32 14 L54 46 Z" fill="currentColor" opacity=".9"/><rect x="10" y="46" width="44" height="6" rx="2" fill="currentColor" opacity=".55"/></svg>
      </span>
      <span>
        <span class="brand-title">জমির ফাইল</span>
        <span class="brand-sub">দলিল ও জমির রেকর্ড সংরক্ষণ</span>
      </span>
    </a>
    <nav class="top-actions">
      <a href="#/new" class="btn btn-gold"><span class="ic">＋</span> নতুন দলিল</a>
      <button class="btn btn-ghost-light" id="menuBtn" aria-label="আরও">⋮</button>
      <div class="menu" id="menu" hidden>
        <div class="menu-usage" id="usage">জায়গা: হিসাব হচ্ছে…</div>
        <button data-act="refresh">⟳ তালিকা হালনাগাদ করুন</button>
        <button data-act="export">⬇ সব রেকর্ড ডাউনলোড (Excel/CSV)</button>
        <button data-act="logout">⎋ লগ আউট</button>
      </div>
    </nav>
  </header>

  <main id="app" class="container"></main>

  <!-- Image viewer -->
  <div class="viewer" id="viewer" hidden>
    <div class="viewer-bar">
      <span class="viewer-title" id="viewerTitle"></span>
      <div class="viewer-tools">
        <button data-v="zoomout" title="ছোট করুন">－</button>
        <span id="viewerZoom">১০০%</span>
        <button data-v="zoomin" title="বড় করুন">＋</button>
        <button data-v="rotate" title="ঘোরান">⟳</button>
        <button data-v="reset" title="আগের মতো">↺</button>
        <button data-v="download" title="ডাউনলোড">⬇</button>
        <button data-v="close" title="বন্ধ করুন">✕</button>
      </div>
    </div>
    <div class="viewer-stage" id="viewerStage">
      <img id="viewerImg" alt="" draggable="false" />
      <div class="viewer-loading" id="viewerLoading" hidden>পূর্ণ ছবি লোড হচ্ছে…</div>
    </div>
    <button class="viewer-nav prev" data-v="prev" aria-label="আগের ছবি">‹</button>
    <button class="viewer-nav next" data-v="next" aria-label="পরের ছবি">›</button>
    <div class="viewer-hint">আঙুল দিয়ে বা মাউসের চাকা ঘুরিয়ে বড়-ছোট করুন · টেনে সরান</div>
  </div>

  <!-- Dialog -->
  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <h3 id="modalTitle"></h3>
      <div id="modalBody"></div>
      <div class="modal-actions">
        <button class="btn btn-light" id="modalCancel">বাতিল</button>
        <button class="btn btn-primary" id="modalOk">ঠিক আছে</button>
      </div>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
